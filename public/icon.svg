<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3" />

  <!-- Orbiting blades circle -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="10 14" opacity="0.4" />

  <!-- Orbiting blade 1 -->
  <g transform="translate(256, 116) rotate(45)" filter="url(#glow)">
    <path d="M 0 -30 Q 14 0 0 30 Q -14 0 0 -30" fill="url(#bladeGrad)" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
  </g>
  
  <!-- Orbiting blade 2 -->
  <g transform="translate(396, 256) rotate(135)" filter="url(#glow)">
    <path d="M 0 -30 Q 14 0 0 30 Q -14 0 0 -30" fill="url(#bladeGrad)" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
  </g>

  <!-- Orbiting blade 3 -->
  <g transform="translate(256, 396) rotate(225)" filter="url(#glow)">
    <path d="M 0 -30 Q 14 0 0 30 Q -14 0 0 -30" fill="url(#bladeGrad)" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
  </g>

  <!-- Orbiting blade 4 -->
  <g transform="translate(116, 256) rotate(315)" filter="url(#glow)">
    <path d="M 0 -30 Q 14 0 0 30 Q -14 0 0 -30" fill="url(#bladeGrad)" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
  </g>

  <!-- Center hero crest: Crossed magical swords / shield -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Aura Glow Ring -->
    <circle cx="0" cy="0" r="68" fill="#38bdf8" opacity="0.15" />
    <circle cx="0" cy="0" r="50" fill="#a855f7" opacity="0.2" />

    <!-- Center Gem -->
    <polygon points="0,-35 28,0 0,35 -28,0" fill="#a855f7" stroke="#e9d5ff" stroke-width="3" />
    <polygon points="0,-22 18,0 0,22 -18,0" fill="#c084fc" />
    <polygon points="0,-12 10,0 0,12 -10,0" fill="#f3e8ff" />

    <!-- Core Arcane Sparks -->
    <circle cx="-16" cy="-16" r="3" fill="#38bdf8" />
    <circle cx="16" cy="-16" r="3" fill="#38bdf8" />
    <circle cx="0" cy="-48" r="4" fill="#fbbf24" />
  </g>

  <!-- Sparks & XP Gems -->
  <polygon points="180,180 186,186 180,192 174,186" fill="#34d399" />
  <polygon points="340,190 348,198 340,206 332,198" fill="#34d399" />
  <polygon points="320,330 327,337 320,344 313,337" fill="#34d399" />
  <polygon points="190,320 197,327 190,334 183,327" fill="#34d399" />
</svg>
